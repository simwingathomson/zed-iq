{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center"><h1>Quizzes</h1><a class="btn btn-primary" href="{{ url_for('teacher.create_quiz') }}">New Quiz</a></div>
<div class="row g-3">{% for quiz in quizzes %}<div class="col-md-4"><div class="card h-100"><div class="card-body"><h5>{{ quiz.title }}</h5><p>{{ quiz.subject.name }} · {{ quiz.questions|length }} questions</p><a class="btn btn-sm btn-outline-primary" href="{{ url_for('teacher.edit_quiz', quiz_id=quiz.id) }}">Edit</a><form class="d-inline" method="post" action="{{ url_for('teacher.toggle_quiz', quiz_id=quiz.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-secondary">{{ 'Deactivate' if quiz.active else 'Activate' }}</button></form></div></div></div>{% endfor %}</div>
{% endblock %}
