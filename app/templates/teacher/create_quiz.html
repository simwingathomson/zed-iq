{% extends "base.html" %}
{% block content %}
<h1>Create Quiz</h1>
<form method="post" class="vstack gap-3 col-lg-7">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Title<input class="form-control" name="title" required></label>
  <label>Subject<select class="form-select" name="subject_id">{% for s in subjects %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></label>
  <label>Or new subject<input class="form-control" name="subject_new"></label>
  <label>Grade<input class="form-control" name="grade" placeholder="Grade 12"></label>
  <label>Timer seconds<input class="form-control" type="number" name="timer_seconds" value="5" min="2"></label>
  <label>Pass mark %<input class="form-control" type="number" name="pass_mark" value="50" min="1" max="100"></label>
  <button class="btn btn-primary">Create</button>
</form>
{% endblock %}
