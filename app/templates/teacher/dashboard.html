{% extends "base.html" %}
{% block content %}
<h1>Teacher Dashboard</h1>
<div class="row g-3">
  <div class="col-md-3"><div class="metric"><span>Students</span><strong>{{ students }}</strong></div></div>
  <div class="col-md-3"><div class="metric"><span>Quizzes</span><strong>{{ quizzes|length }}</strong></div></div>
  <div class="col-md-3"><div class="metric"><span>Average</span><strong>{{ avg }}%</strong></div></div>
  <div class="col-md-3"><div class="metric"><span>Pass Rate</span><strong>{{ passed }}%</strong></div></div>
</div>
<a class="btn btn-primary mt-4" href="{{ url_for('teacher.create_quiz') }}"><i class="bi bi-plus-lg"></i> Create Quiz</a>
<a class="btn btn-outline-primary mt-4" href="{{ url_for('teacher.quizzes') }}">Manage Quizzes</a>
{% endblock %}
