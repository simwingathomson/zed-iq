{% extends "base.html" %}
{% block sponsor %}{% endblock %}
{% block content %}
<div class="quiz-shell mx-auto" data-quiz-id="{{ quiz.id }}" data-csrf="{{ csrf_token() }}">
  <div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3">{{ quiz.title }}</h1><div id="timer" class="timer">{{ quiz.timer_seconds }}</div></div>
  <div class="progress mb-4"><div id="progress" class="progress-bar bg-success" style="width:0%"></div></div>
  <div id="questionArea" class="question-card"><div class="text-center p-5"><div class="spinner-border text-success"></div></div></div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/quiz.js', v='20260809-quiz-flow') }}"></script>{% endblock %}
