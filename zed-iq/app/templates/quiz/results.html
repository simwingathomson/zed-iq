{% extends "base.html" %}
{% block content %}
<div class="result-panel mx-auto text-center">
  <p class="badge {{ 'text-bg-success' if result.passed else 'text-bg-danger' }}">{{ 'PASS' if result.passed else 'FAIL' }}</p>
  <h1>{{ result.score }}/{{ result.total }}</h1>
  <p class="display-6">{{ result.percentage }}%</p>
  <p>Correct: {{ result.score }} · Wrong: {{ result.total - result.score }} · Time: {{ result.time_taken }}s</p>
  <a class="btn btn-primary" href="{{ url_for('student.dashboard') }}">Back to Dashboard</a>
</div>
{% endblock %}
