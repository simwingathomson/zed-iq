{% extends "base.html" %}
{% block content %}
<h1>Topics</h1>
<form method="post" class="row g-2 mb-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="col-md"><select class="form-select" name="subject_id">{% for s in subjects %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></div>
  <div class="col-md"><input class="form-control" name="name" placeholder="Topic name" required></div>
  <div class="col-md"><input class="form-control" name="description" placeholder="Description"></div>
  <div class="col-md d-flex align-items-center"><label class="form-check"><input class="form-check-input" type="checkbox" name="active" checked> <span class="form-check-label">Active</span></label></div>
  <div class="col-auto"><button class="btn btn-primary">Add</button></div>
</form>
<div class="table-responsive"><table class="table align-middle"><tr><th>Subject</th><th>Topic</th><th>Description</th><th>Status</th><th>Built-in</th><th>Actions</th></tr>{% for t in topics %}<tr><form method="post" action="{{ url_for('admin.edit_topic', topic_id=t.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><td><select class="form-select" name="subject_id">{% for s in subjects %}<option value="{{ s.id }}" {% if t.subject_id == s.id %}selected{% endif %}>{{ s.name }}</option>{% endfor %}</select></td><td><input class="form-control" name="name" value="{{ t.name }}"></td><td><input class="form-control" name="description" value="{{ t.description }}"></td><td><input type="checkbox" name="active" {% if t.active %}checked{% endif %}></td><td>{{ 'Yes' if t.built_in else 'No' }}</td><td><button class="btn btn-sm btn-outline-primary">Save</button></form><form method="post" action="{{ url_for('admin.delete_topic', topic_id=t.id) }}" class="d-inline" onsubmit="return confirm('Delete this topic?')"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-danger" {% if t.built_in %}disabled{% endif %}>Delete</button></form></td></tr>{% endfor %}</table></div>
{% endblock %}
