{% extends "base.html" %}
{% block content %}
<h1>Users</h1>
<form class="row g-2 mb-3"><div class="col"><input class="form-control" name="q" placeholder="Search"></div><div class="col-auto"><button class="btn btn-outline-primary">Search</button></div></form>
<form method="post" class="row g-2 mb-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="col-md"><input class="form-control" name="name" placeholder="Name" required></div><div class="col-md"><input class="form-control" type="email" name="email" placeholder="Email" required></div>
  <div class="col-md"><select class="form-select" name="role"><option>student</option><option>teacher</option><option value="super_admin">Super Admin</option></select></div>
  <div class="col-md"><select class="form-select" name="school_id"><option value="">School</option>{% for s in schools %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></div>
  <div class="col-md"><input class="form-control" name="password" placeholder="Password"></div><div class="col-auto"><button class="btn btn-primary">Add</button></div>
</form>
<div class="table-responsive"><table class="table align-middle"><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr>{% for u in users %}<tr><td>{{ u.name }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td><td>{{ 'Active' if u.active else 'Inactive' }}</td><td class="d-flex gap-1"><form method="post" action="{{ url_for('admin.toggle_user', user_id=u.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-secondary">Toggle</button></form><form method="post" action="{{ url_for('admin.reset_password', user_id=u.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-warning">Reset</button></form><form method="post" action="{{ url_for('admin.delete_user', user_id=u.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% endfor %}</table></div>
{% endblock %}
