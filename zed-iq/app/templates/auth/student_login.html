{% extends "base.html" %}
{% block content %}
<div class="auth-panel mx-auto">
  <p class="text-gold fw-semibold mb-1">Think Fast. Think Smart.</p>
  <h1 class="h3">ZED-IQ</h1>
  <form method="post" class="vstack gap-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Student ID<input class="form-control" name="student_id" required></label>
    <label>Password<input class="form-control" type="password" name="password" required></label>
    <button class="btn btn-primary">Login</button>
    <a href="#" class="small">Forgot Password?</a>
  </form>
</div>
{% endblock %}
