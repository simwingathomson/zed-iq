{% extends "base.html" %}
{% block content %}
<h1>Profile</h1>
<form method="post" class="vstack gap-3 col-lg-6">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Name<input class="form-control" name="name" value="{{ current_user.name }}" required></label>
  <label>New password<input class="form-control" type="password" name="password"></label>
  <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
